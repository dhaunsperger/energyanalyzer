[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energyanalyzer"
version = "0.1.0"
description = "Analyze Texas retail electric plans against 15-minute SmartMeter interval data (solar buyback aware)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "pydantic>=2.5",
  "PyYAML>=6",
  "streamlit[pdf]>=1.35",
  "plotly>=5.20",
  "xlsxwriter>=3.2",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
