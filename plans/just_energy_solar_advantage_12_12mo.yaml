notes: 'Buyback Energy Credit 6.0c/kWh on Excess Energy, offsetting up to 100% of
  monthly Energy Charges only -- base, TDSP, taxes and fees are never offset. Unused
  credit is banked to future Energy Charges up to a $500 ceiling and has no cash value
  ($500 bank cap not modelled). Requires an executed Interconnection Agreement and
  a TDSP load profile with a PV designation, which this premises has. Cannot be combined
  with Just Energy''s Excess Generation Buy Back Program. Verified: the model reproduces
  all three published average prices to 0.04c. Not listed by its source on 2026-07-26
  -- the source was reached and did not offer this plan. It may have left the market.'
