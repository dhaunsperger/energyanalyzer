notes: 'NOT USABLE with rooftop solar. Just Energy ToS 10.1(a): for a time-of-use
  plan (''Nights Free Plan, or similar'') Just Energy reserves the right to automatically
  TRANSITION the ESI ID to the Variable Price Product if the premises has solar/distributed
  generation or a battery, OR if the TDU load profile carries a PV/WD/DG designation
  -- which this premises'' does. That is worse than being refused at signup: you enrol
  at the modelled price and are then moved to a 31-day variable product whose price
  changes at their discretion without notice, so none of the economics below hold.
  Its own EFL carries no distributed-generation clause, but it is a time-of-use plan
  and so falls under the ToS ''or similar''. Weekend Hours 7:00PM Friday - 11:59PM
  Sunday credited at 100%. The 25c/kWh Energy Charge is BUNDLED -- the EFL says it
  ''includes all supply and applicable TDSP delivery charges'' -- so tdu_passthrough
  is false; billing TDU on top overstated this plan by ~6.5c/kWh. Confirmed: bundled
  reproduces all three published average prices to 0.05c, passthrough misses by 6.3-6.9c.
  No distributed-generation exclusion. Not listed by its source on 2026-07-26 -- the
  source was reached and did not offer this plan. It may have left the market.'
