notes: 'NOT USABLE with rooftop solar. Just Energy ToS 10.1(a): for a time-of-use
  plan (''Nights Free Plan, or similar'') Just Energy reserves the right to automatically
  TRANSITION the ESI ID to the Variable Price Product if the premises has solar/distributed
  generation or a battery, OR if the TDU load profile carries a PV/WD/DG designation
  -- which this premises'' does. That is worse than being refused at signup: you enrol
  at the modelled price and are then moved to a 31-day variable product whose price
  changes at their discretion without notice, so none of the economics below hold.
  Night Hours 9:00PM-7:00AM credited at 100% of the Energy Charge; TDU delivery still
  billed on night kWh (confirmed: the model reproduces all three published average
  prices to 0.05c). $4.99 minimum-usage fee applies below 400 kWh/cycle -- not modelled.
  EFL: ''Customers with distributed generation may not be eligible for this product''
  -- this premise HAS rooftop solar, so CONFIRM ELIGIBILITY before enrolling.'
