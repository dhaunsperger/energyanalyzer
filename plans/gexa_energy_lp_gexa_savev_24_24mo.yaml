notes: 'Nighttime EV Charging Credit modeled as ev_free_charging: the EFL measures
  it from VEHICLE TELEMATICS (not whole-home interval data), so only EV kWh in the
  11pm-4:59am window earn it -- requires connecting the car to the REP''s telematics
  platform or the credit is $0. Cap 270 kWh/mo is the EFL''s own assumption; on a
  120V (Level 1) circuit a Tesla draws ~1.4kW, so ~8 kWh/night (~255 kWh/mo) is the
  physical ceiling and only if charging nightly. TDU delivery applies to all kWh including
  the window (EFL states this explicitly).'
