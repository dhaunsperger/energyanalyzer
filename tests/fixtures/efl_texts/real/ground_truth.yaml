# Hand-verified ground truth for the real-EFL corpus (tests/fixtures/efl_texts/real/*.txt).
#
# Each entry records the LOAD-BEARING fields only -- the ones that move a bill
# (see eflparse.parser.LOAD_BEARING_KEYS) plus term. Verified by reading each
# fixture's own disclosure table; the quoted line is in `evidence` so a future
# reader can re-check without re-opening the PDF.
#
# Consumed by scripts/eval_efl.py (parser + LLM-tier accuracy harness). The
# pytest classes in tests/test_eflparse.py remain the regression gate; this file
# is the measurement baseline, and the two must not disagree.
#
# Conventions:
#   base_charge_usd  -- the REP's own fixed monthly charge, NOT TDU. 0.0 when the
#                       EFL states none or states it as $0/N/A.
#   energy_rates     -- ordered, first-match-wins, same shape as the Plan schema.
#                       `window: null` on the final catch-all.
#   buyback.kind     -- none | fixed | rtw. `unknown: true` marks an EFL that
#                       answers "yes, we buy back" without disclosing a rate --
#                       genuinely unscoreable, so the harness skips the field
#                       rather than crediting either answer.

AE_TEXAS_Smart_Secure_36_34636.txt:
  # Corrupted font: B/E/s/b/y render as PUA codepoints ("ae Charge" = Base Charge).
  evidence: "ae Charge $0.00 per illing ccle / nerg Charge $0.0649 per kWh"
  term_months: 36
  base_charge_usd: 0.0
  energy_rates: [{rate_ckwh: 6.49, window: null}]
  buyback: {kind: none}

